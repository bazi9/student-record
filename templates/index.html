<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='design.css') }}">
</head>
<body>

    <h2></h2>

    <div class="header-actions">
        <button class="btn-primary" onclick="openAddForm()">+ Add Student</button>

        <div id="topActionBar">
            <button class="btn-secondary" onclick="editSelected()">Edit</button>
            <button class="btn-danger" onclick="removeSelected()">Remove</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 5%;">✓</th>
                <th class="sortable" style="width: 10%;" onclick="sortTable('id', 1, true)">ID ↕</th>
                <th class="sortable" style="width: 26.66%;" onclick="sortTable('name', 2)">Name ↕</th>
                <th class="sortable" style="width: 5%;" onclick="sortTable('age', 3, true)">Age ↕</th>
                <th class="sortable" style="width: 26.66%;" onclick="sortTable('email', 4)">Email ↕</th>
                <th class="sortable" style="width: 26.66%;" onclick="sortTable('address', 5)">Address ↕</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <div id="customContextMenu">
        <ul>
            <li onclick="viewProfile()">View student profile</li>
            <li class="menu-danger" onclick="removeSingleStudent()">Remove student</li>
        </ul>
    </div>

    <div id="addModalOverlay" class="modal-overlay" onclick="closeAddForm()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeAddForm()">✖</button>
            <h3>New Student</h3>
            <div class="form-group"><input type="number" id="idNum" placeholder="ID Number"></div>
            <div class="form-group"><input type="text" id="name" placeholder="Full Name"></div>
            <div class="form-group"><input type="number" id="age" placeholder="Age"></div>
            <div class="form-group"><input type="email" id="email" placeholder="Email Address"></div>
            <div class="form-group"><input type="text" id="address" placeholder="Home Address"></div>
            <button class="btn-primary" onclick="submitStudent()">Save Record</button>
            <button class="btn-secondary" onclick="closeAddForm()">Cancel</button>
        </div>
    </div>

    <div id="editModalOverlay" class="modal-overlay" onclick="closeEditForm()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeEditForm()">✖</button>
            <h3>Edit Student</h3>
            <div class="form-group"><input type="number" id="editIdNum" placeholder="ID Number"></div>
            <div class="form-group"><input type="text" id="editName" placeholder="Full Name"></div>
            <div class="form-group"><input type="number" id="editAge" placeholder="Age"></div>
            <div class="form-group"><input type="email" id="editEmail" placeholder="Email Address"></div>
            <div class="form-group"><input type="text" id="editAddress" placeholder="Home Address"></div>
            <button class="btn-warning" onclick="submitEdit()">Save Changes</button>
            <button class="btn-secondary" onclick="closeEditForm()">Cancel</button>
        </div>
    </div>

    <div id="studentModalOverlay" class="modal-overlay" onclick="closeProfile()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeProfile()">✖</button>
            
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">?</div>
                <div class="profile-name" id="cardName">Student Name</div>
                <div class="profile-subtitle">Student ID: #<span id="cardId">0</span></div>
            </div>

            <div class="profile-details-grid">
                <div class="profile-item">
                    <span class="profile-label">Age</span>
                    <span class="profile-value" id="cardAge">-</span>
                </div>
                <div class="profile-item">
                    <span class="profile-label">Email Address</span>
                    <span class="profile-value" id="cardEmail">-</span>
                </div>
                <div class="profile-item">
                    <span class="profile-label">Home Address</span>
                    <span class="profile-value" id="cardAddress">-</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        let globalStudents = []; 
        let sortDirections = { 1: true, 2: true, 3: true, 4: true, 5: true }; 
        let currentRightClickId = null; 
        let currentEditId = null; 

        window.onload = loadStudents;

        window.onclick = function() {
            document.getElementById('customContextMenu').style.display = 'none';
        }

        function openAddForm() {
            document.getElementById('addModalOverlay').style.display = 'flex';
        }
        function closeAddForm() {
            document.getElementById('addModalOverlay').style.display = 'none';
        }

        function openEditForm() {
            document.getElementById('editModalOverlay').style.display = 'flex';
        }
        function closeEditForm() {
            document.getElementById('editModalOverlay').style.display = 'none';
        }

        function closeProfile() {
            document.getElementById('studentModalOverlay').style.display = 'none';
        }

        async function loadStudents() {
            const response = await fetch('/get_students');
            globalStudents = await response.json();
            renderTable(globalStudents);
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach(student => {
                const row = `<tr>
                    <td><input type="checkbox" class="student-checkbox" value="${student.sys_id}" onchange="checkSelection()"></td>
                    <td><strong>${student.id}</strong></td>
                    <td class="student-name-cell" oncontextmenu="handleRightClick(event, '${student.sys_id}')" title="Right-click for options">${student.name}</td>
                    <td>${student.age}</td>
                    <td>${student.email}</td>
                    <td>${student.address}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
            checkSelection(); 
        }

        function handleRightClick(event, sysId) {
            event.preventDefault(); 
            currentRightClickId = sysId; 

            const menu = document.getElementById('customContextMenu');
            menu.style.display = 'block';
            menu.style.left = event.pageX + 'px'; 
            menu.style.top = event.pageY + 'px';
        }

        function viewProfile() {
            const student = globalStudents.find(s => s.sys_id === currentRightClickId);
            
            if (student) {
                // Populate card fields
                document.getElementById('cardId').innerText = student.id;
                document.getElementById('cardName').innerText = student.name;
                document.getElementById('cardAge').innerText = student.age + " years old";
                document.getElementById('cardEmail').innerText = student.email;
                document.getElementById('cardAddress').innerText = student.address;
                
                // Grab the first letter of the name for the Avatar
                const firstLetter = student.name ? student.name.charAt(0).toUpperCase() : '?';
                document.getElementById('profileAvatar').innerText = firstLetter;
                
                document.getElementById('studentModalOverlay').style.display = 'flex';
            }
        }

        async function removeSingleStudent() {
            if(confirm("Are you sure you want to remove this specific student?")) {
                await fetch('/delete_students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: [currentRightClickId] })
                });
                loadStudents();
            }
        }

        function sortTable(columnKey, colIndex, isNumber = false) {
            let isAsc = sortDirections[colIndex];

            globalStudents.sort((a, b) => {
                let valA = a[columnKey];
                let valB = b[columnKey];

                if (isNumber) {
                    valA = parseFloat(valA) || 0;
                    valB = parseFloat(valB) || 0;
                    return isAsc ? valA - valB : valB - valA;
                } else {
                    valA = valA.toLowerCase();
                    valB = valB.toLowerCase();
                    if (valA < valB) return isAsc ? -1 : 1;
                    if (valA > valB) return isAsc ? 1 : -1;
                    return 0;
                }
            });

            sortDirections[colIndex] = !isAsc;
            renderTable(globalStudents);
        }

        async function submitStudent() {
            const idVal = document.getElementById('idNum').value;
            const nameVal = document.getElementById('name').value;
            const ageVal = document.getElementById('age').value;
            const emailVal = document.getElementById('email').value;
            const addressVal = document.getElementById('address').value;

            if (idVal === "" || isNaN(idVal)) { alert("Error: ID must be a valid number."); return; }
            if (nameVal.trim() === "") { alert("Error: Name cannot be blank."); return; }
            if (ageVal === "" || isNaN(ageVal)) { alert("Error: Age must be a valid number."); return; }
            if (!emailVal.includes("@")) { alert("Error: Email must contain an '@' symbol."); return; }
            if (addressVal.trim() === "") { alert("Error: Address cannot be blank."); return; }

            const data = {
                id: idVal,
                name: nameVal,
                age: ageVal,
                email: emailVal,
                address: addressVal
            };

            await fetch('/add_student', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            document.getElementById('idNum').value = '';
            document.getElementById('name').value = '';
            document.getElementById('age').value = '';
            document.getElementById('email').value = '';
            document.getElementById('address').value = '';

            closeAddForm();
            loadStudents(); 
        }

        function checkSelection() {
            const checkboxes = document.querySelectorAll('.student-checkbox');
            const actionBar = document.getElementById('topActionBar'); 
            let isChecked = false;

            checkboxes.forEach(box => { if (box.checked) isChecked = true; });
            actionBar.style.display = isChecked ? 'flex' : 'none';
        }

        async function removeSelected() {
            const checkboxes = document.querySelectorAll('.student-checkbox:checked');
            const idsToRemove = Array.from(checkboxes).map(box => box.value);

            if(confirm("Are you sure you want to remove selected students?")) {
                await fetch('/delete_students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: idsToRemove })
                });
                loadStudents();
                closeEditForm();
            }
        }

        function editSelected() {
            const checkboxes = document.querySelectorAll('.student-checkbox:checked');
            
            if (checkboxes.length !== 1) {
                alert("Please select exactly one student to edit.");
                return;
            }
            
            const sysId = checkboxes[0].value;
            const student = globalStudents.find(s => s.sys_id === sysId);
            
            if (student) {
                currentEditId = sysId; 
                
                document.getElementById('editIdNum').value = student.id;
                document.getElementById('editName').value = student.name;
                document.getElementById('editAge').value = student.age;
                document.getElementById('editEmail').value = student.email;
                document.getElementById('editAddress').value = student.address;
                
                openEditForm();
            }
        }

        async function submitEdit() {
            const idVal = document.getElementById('editIdNum').value;
            const nameVal = document.getElementById('editName').value;
            const ageVal = document.getElementById('editAge').value;
            const emailVal = document.getElementById('editEmail').value;
            const addressVal = document.getElementById('editAddress').value;

            if (idVal === "" || isNaN(idVal)) { alert("Error: ID must be a valid number."); return; }
            if (nameVal.trim() === "") { alert("Error: Name cannot be blank."); return; }
            if (ageVal === "" || isNaN(ageVal)) { alert("Error: Age must be a valid number."); return; }
            if (!emailVal.includes("@")) { alert("Error: Email must contain an '@' symbol."); return; }
            if (addressVal.trim() === "") { alert("Error: Address cannot be blank."); return; }

            const data = {
                sys_id: currentEditId, 
                id: idVal,
                name: nameVal,
                age: ageVal,
                email: emailVal,
                address: addressVal
            };

            await fetch('/edit_student', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            closeEditForm();
            loadStudents(); 
            
            document.querySelectorAll('.student-checkbox').forEach(box => box.checked = false);
            checkSelection(); 
        }
    </script>
</body>
</html>
