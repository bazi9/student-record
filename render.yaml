# Optional: lets Render auto-configure the service from this file (Blueprint).
# You can also set everything manually in the Render dashboard instead.
services:
  - type: web
    name: student-record
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"           # psycopg2-binary has no wheel for 3.14 yet
      - key: SECRET_KEY
        generateValue: true       # Render generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: student-record-db
          property: connectionString

databases:
  - name: student-record-db
    plan: free
